<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Keyturn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-width app column. Full-bleed street map behind bottom sheets (home, book, match, trip, done); tab pages (activity, membership, account, driver preview) cover the map. Black primary actions, light grey surfaces. */
:root{
  --bg:#ffffff; --fg:#0b0b0c; --muted:#5f5f66; --surface:#f2f2f4; --surface-2:#e4e4e8; --line:#e3e3e7;
  --btn:#0b0b0c; --btn-fg:#ffffff; --ok:#0a7d3e; --ok-bg:#e1f3e8; --warn:#8a5200; --warn-bg:#fbeed3; --bad:#c9261b; --bad-bg:#fde6e3;
  --map-bg:#eceeec; --map-block:#e2e5e2; --map-road:#ffffff; --map-road2:#f7f8f7; --map-park:#cfe5cb; --map-water:#c6dfee; --map-label:#7b807c; --route:#0b0b0c;
  --stage:#e6e6ea; --shadow:rgba(0,0,0,.16);
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111113; --fg:#f4f4f6; --muted:#a2a2ab; --surface:#1d1d20; --surface-2:#2a2a2e; --line:#2d2d32;
  --btn:#f4f4f6; --btn-fg:#0b0b0c; --ok:#4cc17f; --ok-bg:#12301f; --warn:#e8b04a; --warn-bg:#352a10; --bad:#ff6f64; --bad-bg:#3b1815;
  --map-bg:#181a19; --map-block:#1f2221; --map-road:#2f3231; --map-road2:#292c2b; --map-park:#1c2b1f; --map-water:#192a36; --map-label:#7d827e; --route:#f4f4f6;
  --stage:#050506; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113; --fg:#f4f4f6; --muted:#a2a2ab; --surface:#1d1d20; --surface-2:#2a2a2e; --line:#2d2d32;
  --btn:#f4f4f6; --btn-fg:#0b0b0c; --ok:#4cc17f; --ok-bg:#12301f; --warn:#e8b04a; --warn-bg:#352a10; --bad:#ff6f64; --bad-bg:#3b1815;
  --map-bg:#181a19; --map-block:#1f2221; --map-road:#2f3231; --map-road2:#292c2b; --map-park:#1c2b1f; --map-water:#192a36; --map-label:#7d827e; --route:#f4f4f6;
  --stage:#050506; --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
.stage{height:100%;display:flex;justify-content:center;align-items:center}
.app{position:relative;width:100%;height:100%;max-width:430px;max-height:900px;overflow:hidden;background:var(--bg)}
@media (min-width:520px){.stage{padding-block:16px}.app{border-radius:28px;box-shadow:0 24px 70px var(--shadow);border:1px solid var(--line)}}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.ic{flex:none;display:block}
.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}

/* map */
.map{position:absolute;inset:0;background:var(--map-bg)}
.map svg{width:100%;height:100%;display:block}
.m-road{stroke:var(--map-road);fill:none;stroke-linecap:butt}
.m-road.minor{stroke:var(--map-road2)}
.m-label{font:600 9px var(--font);fill:var(--map-label);letter-spacing:.06em;text-transform:uppercase}
.l-route,.l-dest,.l-approach,.l-car{visibility:hidden}
.show-route .l-route,.show-route .l-dest{visibility:visible}
.show-approach .l-approach{visibility:visible}
.show-car .l-car{visibility:visible}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.35}100%{transform:scale(3.2);opacity:0}}

/* top bar over map */
.top{position:absolute;left:var(--gl);right:var(--gr);top:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--bg);box-shadow:0 2px 10px var(--shadow);display:grid;place-items:center}
.rbtn.sos{background:var(--bad);color:#fff}
.brand{background:var(--bg);box-shadow:0 2px 10px var(--shadow);border-radius:22px;height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.03em}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--fg);display:block;transform:rotate(45deg)}
.status{background:var(--bg);box-shadow:0 2px 10px var(--shadow);border-radius:22px;height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px var(--shadow);display:flex;flex-direction:column;animation:rise .28s ease;z-index:6}
@keyframes rise{from{transform:translateY(28px);opacity:.4}}
.h-home{height:58%}.h-book{height:70%}.h-match{height:54%}.h-trip{height:50%}.h-done{height:84%}
.grab{width:36px;height:4px;border-radius:2px;background:var(--surface-2);margin:8px auto 4px;flex:none}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-block:10px 20px;overscroll-behavior:contain}
.h-home .sheet-body{padding-bottom:92px}
.sheet-foot{flex:none;padding:12px var(--gr) 12px var(--gl);border-top:1px solid var(--line);background:var(--bg);display:grid;gap:8px}

/* pages (tab screens) */
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:6}
.page-head{flex:none;padding:18px var(--gr) 10px var(--gl);display:flex;align-items:center;gap:12px}
.page-head h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.page-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:92px}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding:0 var(--gr) 0 var(--gl)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 12px;font-size:11px;font-weight:700;color:var(--muted)}
.tab[aria-current="page"]{color:var(--fg)}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:16px;text-align:center}
.btn.sec{background:var(--surface);color:var(--fg)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm2{min-height:44px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-title{font-size:18px;font-weight:800;letter-spacing:-.02em}
.stack{display:grid;gap:18px}
.stack-s{display:grid;gap:10px}
.rowx{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sp{height:1px;background:var(--line);border:0;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:19px;background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btn-fg)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border-radius:9px;font-weight:700;font-size:14px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:0 1px 4px var(--shadow)}
.field{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:0 14px;min-height:52px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-weight:600}
.field:focus-within{box-shadow:0 0 0 2px var(--fg)}
.field input::placeholder{color:var(--muted);font-weight:500}
.plain{width:100%;background:var(--surface);border:0;border-radius:12px;min-height:48px;padding:0 14px;font-weight:600}
textarea.plain{padding:12px 14px;min-height:76px;resize:vertical;font-weight:500}
select.plain{appearance:auto}
.dot{width:10px;height:10px;border-radius:50%;background:var(--fg);flex:none}
.sq{width:10px;height:10px;border-radius:2px;background:var(--fg);flex:none}
.sugg{display:grid;margin-top:6px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.sugg button{display:flex;align-items:center;gap:12px;padding:12px 14px;font-weight:600}
.sugg button+button{border-top:1px solid var(--line)}
.sugg .ic{color:var(--muted)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px var(--shadow);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--btn)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.card{background:var(--surface);border-radius:14px;padding:14px}
.card.line{background:var(--bg);border:1px solid var(--line)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:20px}
.icon-tile{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}

/* home */
.greet{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.1;text-wrap:balance}
.search{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;background:var(--surface);border-radius:12px;padding:0 8px 0 16px;font-weight:700;font-size:17px}
.search .grow{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:18px;padding:7px 12px;font-size:13px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px 10px;background:var(--surface);border-radius:12px;font-size:12px;font-weight:700;text-align:center;line-height:1.15}
.promo{background:var(--btn);color:var(--btn-fg);border-radius:14px;padding:16px;display:grid;gap:6px}
.promo .big{font-size:22px;font-weight:800;letter-spacing:-.03em}
.promo .badge{background:rgba(127,127,127,.28);color:inherit;width:fit-content}
.trust{display:grid;gap:14px}

/* booking */
.route-card{display:grid;gap:8px}
.route-card .line{position:absolute}
.pkgs{display:flex;gap:8px;overflow-x:auto;padding:2px var(--gr) 4px var(--gl);margin:0 calc(-1*var(--gr)) 0 calc(-1*var(--gl));scrollbar-width:none}
.pkgs::-webkit-scrollbar{display:none}
.pkg{flex:none;min-width:92px;padding:12px;border-radius:12px;background:var(--surface);display:grid;gap:2px;border:2px solid transparent}
.pkg b{font-size:15px}
.pkg span{font-size:13px;color:var(--muted);font-weight:600}
.pkg.on{border-color:var(--fg);background:var(--bg)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid transparent}
.opt.on{border-color:var(--fg);background:var(--bg)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv.tot{font-size:17px;font-weight:800;padding-top:10px;border-top:1px solid var(--line);margin-top:2px}
.kv .neg{color:var(--ok);font-weight:700}

/* match / trip */
.radar{position:relative;width:96px;height:96px;margin:6px auto;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--fg);opacity:0;animation:ring 1.8s ease-out infinite}
.radar i:nth-child(2){animation-delay:.6s}.radar i:nth-child(3){animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.3);opacity:.6}100%{transform:scale(1);opacity:0}}
.radar .core{width:44px;height:44px;border-radius:50%;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;position:relative}
.otp{display:flex;gap:8px}
.otp span{width:44px;height:52px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:24px;font-weight:800}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;text-align:center}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--btn);border-radius:4px;transition:width .4s linear}
.bar.over i{background:var(--warn)}
.big{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{color:var(--surface-2)}
.stars button.on{color:var(--fg)}

/* lists */
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.item:last-child{border-bottom:0}

/* modal */
.modal{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.msheet{position:relative;width:100%;max-height:88%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:rise .24s ease}
.mbody{overflow-y:auto;padding:6px var(--gr) 8px var(--gl);display:grid;gap:14px;min-height:0}
.mfoot{padding:8px var(--gr) 14px var(--gl);display:grid;gap:8px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:160px;max-height:300px;overflow-y:auto}
.msg{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--surface);font-size:14px}
.msg.me{align-self:flex-end;background:var(--btn);color:var(--btn-fg)}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:var(--btn);color:var(--btn-fg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hero-card{background:var(--btn);color:var(--btn-fg);border-radius:16px;padding:18px;display:grid;gap:10px}
.hero-card .big{font-size:30px}
.copybox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:700;word-break:break-all}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
<div class="app" id="app">
  <div class="map" id="map" aria-hidden="true">
    <svg viewBox="0 0 430 900" preserveAspectRatio="xMidYMid slice">

      <g class="l-route">
        <path d="M110 270 V215 Q110 205 120 205 H235 Q245 205 245 195 V140 Q245 130 255 130 H320" fill="none" stroke="var(--bg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="route" d="M110 270 V215 Q110 205 120 205 H235 Q245 205 245 195 V140 Q245 130 255 130 H320" fill="none" stroke="var(--route)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  </div>
  <div class="top" id="top"></div>

</div>

const PK={1:[279,329],2:[379,439],4:[489,539],6:[649,709],8:[799,869],12:[1099,1189]};
const OUT=[1499,1699], ALLOW=400, OVER=[4.5,5.5], PROT=49, NIGHT=150, MEMBER_FEE=199;
const pkgMin=b=>b.pkg==='out'?b.days*1440:b.pkg*60;
const tIdx=b=>b.tier==='plus'?1:0;
const base=b=>b.pkg==='out'?b.days*OUT[tIdx(b)]+(b.days-1)*ALLOW:PK[b.pkg][tIdx(b)];
const pkgText=b=>b.pkg==='out'?`Outstation · ${b.days} day${b.days>1?'s':''}`:`${b.pkg} hour${b.pkg>1?'s':''}`;
function isNight(b){let h;if(b.when==='now')h=new Date().getHours();else h=parseInt((b.time||'12:00').split(':')[0],10);return h>=22||h<5}
function fare(b,elapsed=0,extras=0,tip=0){
  const bs=base(b),over=Math.round(Math.max(0,elapsed-pkgMin(b))*OVER[tIdx(b)]);
  const night=(b._night!==undefined?b._night:isNight(b))?NIGHT:0;
  const disc=S.member?Math.round((bs+over)*0.10):0;
  const taxable=bs+over+night-disc, gst=Math.round(taxable*0.05), prot=b.prot?PROT:0;
  return {bs,over,night,disc,gst,prot,extras,tip,total:taxable+gst+prot+extras+tip};
}

(function buildGrid(){
  const xs=[40,110,180,245,320,390],ys=[60,130,205,290,370,450,540,640,760,900];
  let h='';const X=[-30,...xs,460],Y=[-30,...ys.slice(0,-1),ys[ys.length-1]];
  for(let i=0;i<X.length-1;i++)for(let j=0;j<Y.length-1;j++){
    if((i*7+j*3)%5===0)continue;
    h+=`<rect x="${X[i]+8}" y="${Y[j]+8}" width="${X[i+1]-X[i]-16}" height="${Y[j+1]-Y[j]-16}" rx="4" fill="var(--map-block)"/>`;
  }
  xs.forEach(x=>{h+=`<line class="m-road ${x===110||x===245?'':'minor'}" x1="${x}" y1="0" x2="${x}" y2="900" stroke-width="${x===110||x===245?11:6}"/>`});
  ys.slice(0,-1).forEach(y=>{h+=`<line class="m-road ${[130,205,370].includes(y)?'':'minor'}" x1="0" y1="${y}" x2="430" y2="${y}" stroke-width="${[130,205,370].includes(y)?11:6}"/>`});
  $('#grid').innerHTML=h;
})();
function placeCar(path,p){
  const L=path.getTotalLength(),a=Math.max(0,L*p-1.5),c=Math.min(L,a+3);
  const pt=path.getPointAtLength(L*p),p1=path.getPointAtLength(a),p2=path.getPointAtLength(c);
  const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x)*180/Math.PI+90;
  $('#car').setAttribute('transform',`translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
}

function render(){
  const sb=document.querySelector('.sheet-body,.page-body');
  const keep=sb&&lastScreen===S.screen?sb.scrollTop:0;
  if(S.screen==='match'&&!A)S.screen='home';
  if((S.screen==='trip'||S.screen==='done')&&!A)S.screen='home';
  $('#top').innerHTML=topHTML();
  $('#view').innerHTML=VIEWS[S.screen]();
  const tabsOn=['home','activity','member','account'].includes(S.screen);
  $('#tabs').hidden=!tabsOn;if(tabsOn)$('#tabs').innerHTML=navHTML();
  lastScreen=S.screen;
  const nb=document.querySelector('.sheet-body,.page-body');if(nb)nb.scrollTop=keep;
  syncMap();updateLive();
}
function updateLive(){
  if(!A)return;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  if(S.screen==='match'&&(A.phase==='assigned'||A.phase==='arrived')){
    if(A.phase==='assigned')set('eta',A.eta+' min');
    placeCar($('#approach'),A.phase==='arrived'?1:(A.etaTotal-A.eta)/A.etaTotal);
  }
  if(S.screen==='trip'&&A.phase==='trip'){
    const b=A.b,pm=pkgMin(b),f=fare(b,A.elapsed,extrasSum());
    set('elapsed',fmtDur(A.elapsed));set('fare',inr(f.total-f.gst));
    const over=A.elapsed>pm;
    set('left',over?`${fmtDur(A.elapsed-pm)} over your ${pkgText(b)} package`:`${fmtDur(pm-A.elapsed)} left in your ${pkgText(b)} package`);
    const bar=$('#bar');if(bar){bar.style.width=Math.min(100,A.elapsed/pm*100)+'%'}
    const bw=$('#barwrap');if(bw)bw.classList.toggle('over',over);
    const t=(A.elapsed/18)%2;placeCar($('#route'),t<=1?t:2-t);
  }
}
setInterval(()=>{
  if(!A)return;
  if(A.phase==='search'){A.searchLeft--;if(A.searchLeft<=0){A.driver=pickDriver(A.b);A.otp=String(1000+Math.floor(Math.random()*9000));A.phase='assigned';A.etaTotal=A.eta=7;render()}}
  else if(A.phase==='assigned'){A.eta--;if(A.eta<=0){A.phase='arrived';render()}else updateLive()}
  else if(A.phase==='trip'){A.elapsed++;updateLive()}
},1000);

/* actions */
function confirmBooking(){
  const b=S.b;
  if(!b.pickup.trim()){toast('Add a pickup location');return}
  if(b.pkg==='out'&&!b.drop.trim()){toast('Add a destination for outstation trips');const d=$('#drop');if(d)d.focus();return}
  const car=S.cars[b.car]||S.cars[0],id='KT-'+(2200+Math.floor(Math.random()*800));
  if(b.when==='schedule'){
    const dt=new Date(b.date+'T'+b.time);
    if(isNaN(dt)||dt<=new Date()){toast('Pick a pickup time in the future');return}
    S.trips.unshift({id,status:'upcoming',when:fmtDT(dt),from:b.pickup,to:b.drop||'Local drive',pkgText:pkgText(b),tier:b.tier==='plus'?'Plus':'Classic',car:car.name,driver:'Assigned 30 min before pickup',total:fare(b).total});
    persist();S.actTab='upcoming';S.screen='activity';S.b=newBooking();render();toast('Driver scheduled');return;
  }
  A={id,b:JSON.parse(JSON.stringify(b)),phase:'search',searchLeft:3,eta:7,etaTotal:7,elapsed:0,extras:[],stops:[],driver:null,otp:'0000'};
  A.b._night=isNight(b);S.screen='match';render();
}

function scheduleReq(){
  clearTimeout(D.timer);
  if(!D.online||D.req||D.active)return;
  D.timer=setTimeout(()=>{
    if(!D.online||D.req||D.active)return;
    const pool=[{from:'Indiranagar 100 Ft Rd',km:1.2,pkg:'4 hours',car:'Hyundai Creta · Automatic',fare:539},{from:'Koramangala 5th Block',km:2.4,pkg:'2 hours',car:'Maruti Swift · Manual',fare:379},{from:'MG Road Metro Station',km:0.8,pkg:'6 hours',car:'Kia Seltos · Automatic',fare:649}];
    D.req=pool[Math.floor(Math.random()*pool.length)];if(S.screen==='driver')render();
  },2500);
}

function act(a,t,e){
  const v=t.dataset.v,b=S.b;
  switch(a){
    case 'tab':S.screen=t.dataset.t;render();break;
    case 'goto':S.screen=t.dataset.s;render();break;
    case 'quick':b.drop=t.dataset.to;S.screen='book';render();break;
    case 'preset':presetBooking(t.dataset.p);break;
    case 'when':b.when=v;render();break;
    case 'pkg':b.pkg=v==='out'?'out':+v;render();break;
    case 'days':b.days=Math.max(1,Math.min(7,b.days+ +t.dataset.d));render();break;
    case 'tier':b.tier=v;render();break;
    case 'car':b.car=+v;render();break;
    case 'lang':b.lang=v;render();break;
    case 'pay':b.pay=v;render();break;
    case 'pet':b.pet=!b.pet;render();break;
    case 'prot':b.prot=!b.prot;render();break;
    case 'pick':b.drop=v;S.sugg=false;render();break;
    case 'confirm':confirmBooking();break;
    case 'cancel-search':A=null;S.screen='home';render();toast('Booking cancelled');break;
    case 'start-trip':A.phase='trip';A.elapsed=0;S.screen='trip';render();break;
    case 'call':toast('Connecting through a masked number (demo)');break;
    case 'chat':openChat(t.dataset.w||'driver');break;
    case 'send':{const i=$('#chatin');sendMsg(i.value);i.value='';i.focus();break}
    case 'quickmsg':sendMsg(v);break;
    case 'share':openShare();break;
    case 'copy':{const ok=()=>toast('Link copied');try{navigator.clipboard.writeText(v).then(ok,()=>{const r=document.createRange();r.selectNodeContents($('#lnk'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Press copy to finish')})}catch(err){toast('Select the link to copy')}break}
    case 'sos':openSOS();break;
    case 'sos-send':$('#sosbody').innerHTML=`<div class="card" style="background:var(--ok-bg);color:var(--ok)"><div class="b">Alert sent (demo)</div><div class="sm">Support has your live location and is calling you now. Dial 112 for emergency services.</div></div>`;$('#sosfoot').innerHTML=`<button class="btn" data-act="close-modal">Close</button>`;break;
    case 'close-modal':closeModal();break;
    case 'expense':A.extras.push({l:t.dataset.l,amt:+t.dataset.a});render();break;
    case 'addstop':openModal(`<div class="mbody"><div class="between"><h2 class="sec-title">Add a stop</h2><button class="rbtn" style="box-shadow:none;background:var(--surface)" data-act="close-modal" aria-label="Close">${ic('close')}</button></div><label class="field"><span class="sq"></span><input id="stopin" placeholder="Where should the driver stop?" aria-label="Stop"></label><div class="chips">${['Pharmacy','Grocery store','Fuel station','Restaurant'].map(s=>`<button class="chip" data-act="stoppick" data-v="${s}">${s}</button>`).join('')}</div></div><div class="mfoot"><button class="btn" data-act="stopsave">Add stop</button></div>`);break;
    case 'stoppick':$('#stopin').value=v;break;
    case 'stopsave':{const s=$('#stopin').value.trim();if(!s){toast('Enter a stop name');break}A.stops.push(s);closeModal();render();toast('Stop added. Time keeps counting within your package');break}
    case 'end-ask':openModal(`<div class="mbody"><h2 class="sec-title">End this trip?</h2><p class="sm muted">The driver returns your keys and the final fare is calculated from time driven.</p></div><div class="mfoot"><button class="btn" data-act="end-trip">End trip</button><button class="btn sec" data-act="close-modal">Keep going</button></div>`);break;
    case 'end-trip':endTrip();break;
    case 'star':S.rating=+v;render();break;
    case 'tag':S.tags=S.tags.includes(v)?S.tags.filter(x=>x!==v):S.tags.concat(v);render();break;
    case 'tip':S.tip=+v;render();break;
    case 'fav':{const id=A.driver.id;S.pref=S.pref.includes(id)?S.pref.filter(x=>x!==id):S.pref.concat(id);persist();render();break}
    case 'submit':submitDone();break;
    case 'acttab':S.actTab=v;render();break;
    case 'trip-detail':openTrip(t.dataset.id);break;
    case 'cancel-up':S.trips=S.trips.filter(x=>x.id!==t.dataset.id);persist();closeModal();render();toast('Booking cancelled');break;
    case 'rebook':{const tr=S.trips.find(x=>x.id===t.dataset.id);closeModal();if(tr){S.b=newBooking();S.b.drop=tr.to;if(/Outstation/.test(tr.pkgText))S.b.pkg='out';else{const h=parseInt(tr.pkgText,10);if(PK[h])S.b.pkg=h}}S.screen='book';render();break}
    case 'member':S.member=!S.member;persist();render();toast(S.member?'Welcome to Keyturn Plus (demo)':'Membership cancelled');break;
    case 'theme':S.theme=v;applyTheme();persist();render();break;
    case 'delcar':S.cars.splice(+v,1);S.b.car=0;persist();render();break;
    case 'delpref':S.pref=S.pref.filter(x=>x!==v);if(S.b.pref===v)S.b.pref='any';persist();render();break;
    case 'addcar':openModal(`<div class="mbody"><div class="between"><h2 class="sec-title">Add a car</h2><button class="rbtn" style="box-shadow:none;background:var(--surface)" data-act="close-modal" aria-label="Close">${ic('close')}</button></div>
      <label class="sm muted" for="cn">Make and model</label><input class="plain" id="cn" placeholder="e.g. Tata Nexon EV" autocomplete="off">
      <label class="sm muted" for="ct">Type</label><select class="plain" id="ct"><option>Hatchback</option><option>Sedan</option><option selected>SUV</option><option>Luxury</option><option>EV</option></select>
      <label class="sm muted" for="cg">Transmission</label><select class="plain" id="cg"><option>Automatic</option><option>Manual</option></select></div><div class="mfoot"><button class="btn" data-act="savecar">Save car</button></div>`);break;
    case 'savecar':{const n=$('#cn').value.trim();if(!n){toast('Enter the car model');break}S.cars.push({name:n,type:$('#ct').value,gear:$('#cg').value});S.b.car=S.cars.length-1;persist();closeModal();render();toast('Car added');break}
    case 'drv-online':D.online=!D.online;if(!D.online){D.req=null;clearTimeout(D.timer)}else scheduleReq();render();break;
    case 'drv-accept':D.active=D.req;D.req=null;render();break;
    case 'drv-decline':D.req=null;scheduleReq();render();break;
    case 'drv-complete':D.earn+=Math.round(D.active.fare*0.82);D.trips++;D.active=null;scheduleReq();render();toast('Trip completed. Earnings updated');break;
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(S.sugg&&!e.target.closest('.drop-wrap')){S.sugg=false;const s=$('#sugg');if(s)s.innerHTML=''}return}
  act(t.dataset.act,t,e);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
  if(k==='pickup')S.b.pickup=e.target.value;
  else if(k==='drop'){S.b.drop=e.target.value;S.sugg=true;$('#sugg').innerHTML=suggHTML();syncMap()}
  else if(k==='review')S.review=e.target.value;
  else if(k==='name'){S.name=e.target.value;persist()}
});
document.addEventListener('focusin',e=>{if(e.target.id==='drop'){S.sugg=true;$('#sugg').innerHTML=suggHTML()}});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;
  if(k==='date'||k==='time'){S.b[k]=e.target.value;render()}
  else if(k==='pref'){S.b.pref=e.target.value}
  else if(k==='drop')render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatin'){e.preventDefault();sendMsg(e.target.value);e.target.value=''}
  if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
});

applyTheme();render();
})();
</script>

</body></html>
